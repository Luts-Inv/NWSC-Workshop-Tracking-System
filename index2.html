<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NWSC Pump Asset Management</title>

    <!-- QR GENERATOR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- QR SCANNER -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 15px;
            color: #111827;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* TABS */

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: white;
            font-weight: bold;
            cursor: pointer;
            color: #6b7280;
        }

        .tab.active {
            color: #1d4ed8;
            border-bottom: 3px solid #1d4ed8;
        }

        /* FORM */

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media(min-width:500px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }

            .full {
                grid-column: span 2;
            }
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            background: #1d4ed8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #1e40af;
        }

        .btn-secondary {
            background: #6b7280;
        }

        /* QR */

        #qr-section {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            border: 2px dashed #d1d5db;
            border-radius: 10px;
        }

        #qr-code {
            display: flex;
            justify-content: center;
            margin: 15px;
        }

        .record-id {
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
        }

        .notice {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .info {
            background: #eff6ff;
            color: #1e40af;
        }

        .warning {
            background: #fff7ed;
            color: #9a3412;
        }

        /* SCANNER */

        #scan-section {
            display: none;
        }

        #reader {
            width: 100%;
            margin-top: 15px;
        }

        #result {
            display: none;
            margin-top: 20px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .badge {
            background: #1d4ed8;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 5px;
            border-bottom: 1px solid #dbeafe;
            background: white;
        }

        .data-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: bold;
        }

        .data-value {
            font-size: 13px;
            font-weight: bold;
            text-align: right;
            word-break: break-word;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>NWSC PUMP ASSET MANAGEMENT</h1>

    <!-- TABS -->

    <div class="tabs">

        <button
            id="generate-tab"
            class="tab active"
            onclick="showGenerate()">
            LOG NEW PUMP
        </button>

        <button
            id="scan-tab"
            class="tab"
            onclick="showScanner()">
            SCAN PUMP QR
        </button>

    </div>


    <!-- ========================= -->
    <!-- GENERATE SECTION -->
    <!-- ========================= -->

    <div id="generate-section">

        <div class="grid">

            <div>
                <label>Record ID</label>

                <input
                    id="recordId"
                    type="text"
                    placeholder="Automatic">
            </div>


            <div>
                <label>Entry Date</label>

                <input
                    id="entryDate"
                    type="date">
            </div>


            <div>
                <label>NWSC Asset Number</label>

                <input
                    id="assetNumber"
                    type="text"
                    placeholder="e.g. 127R2">
            </div>


            <div>
                <label>Serial Number</label>

                <input
                    id="serialNumber"
                    type="text"
                    placeholder="e.g. SN88404">
            </div>


            <div>
                <label>Pump Manufacturer</label>

                <input
                    id="pumpManufacturer"
                    type="text"
                    placeholder="e.g. Grundfos">
            </div>


            <div>
                <label>Pump Model</label>

                <input
                    id="pumpModel"
                    type="text">
            </div>


            <div>
                <label>Pump Type</label>

                <select id="pumpType">

                    <option value="Centrifugal">
                        Centrifugal
                    </option>

                    <option value="Submersible">
                        Submersible
                    </option>

                    <option value="Booster">
                        Booster
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>
                <label>Pump Capacity (m³/h)</label>

                <input
                    id="pumpCapacity"
                    type="number"
                    step="any">
            </div>


            <div>
                <label>Motor Rating (kW)</label>

                <input
                    id="motorRating"
                    type="number"
                    step="any">
            </div>


            <div>
                <label>Motor Serial Number</label>

                <input
                    id="motorSerialNumber"
                    type="text">
            </div>


            <div>
                <label>Station</label>

                <input
                    id="station"
                    type="text"
                    placeholder="e.g. Ggaba">
            </div>


            <div>
                <label>Location / Installation Point</label>

                <input
                    id="location"
                    type="text">
            </div>


            <div>
                <label>Delivered By</label>

                <input
                    id="deliveredBy"
                    type="text">
            </div>


            <div>
                <label>Date Received</label>

                <input
                    id="dateReceived"
                    type="date">
            </div>


            <div>
                <label>Fault Reported</label>

                <input
                    id="faultReported"
                    type="text"
                    placeholder="None">
            </div>


            <div>
                <label>Condition</label>

                <select id="condition">

                    <option value="Good">
                        Good
                    </option>

                    <option value="Fair">
                        Fair
                    </option>

                    <option value="Poor">
                        Poor
                    </option>

                    <option value="Out of Service">
                        Out of Service
                    </option>

                </select>

            </div>

        </div>


        <button
            class="btn"
            onclick="generatePump()">

            GENERATE PUMP QR CODE

        </button>


        <!-- QR OUTPUT -->

        <div id="qr-section">

            <div class="record-id">
                Record ID:
                <span id="displayRecordId"></span>
            </div>

            <div id="qr-code"></div>

            <div class="notice info">

                This QR contains the unique Pump Record ID.
                When scanned, the system retrieves the pump
                specifications from the GitHub database.

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- SCANNER SECTION -->
    <!-- ========================= -->

    <div id="scan-section">

        <div id="reader"></div>

        <div id="result">

            <div class="result-header">

                <strong>
                    PUMP SPECIFICATIONS
                </strong>

                <span
                    id="resultRecordId"
                    class="badge">
                </span>

            </div>

            <div id="pumpData"></div>

            <button
                class="btn btn-secondary"
                onclick="restartScanner()">

                SCAN ANOTHER PUMP

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================
   GITHUB DATABASE
   ===================================== */

const DATABASE_URL =
"https://luts-inv.github.io/NWSC-Workshop-Tracking-System/pumps.json";


/* =====================================
   WEBSITE URL
   ===================================== */

const WEBSITE_URL =
"https://luts-inv.github.io/NWSC-Workshop-Tracking-System/";


/* =====================================
   SCANNER VARIABLES
   ===================================== */

let scanner = null;
let scannerRunning = false;


/* =====================================
   PAGE LOAD
   ===================================== */

window.addEventListener("load", function() {

    const today =
        new Date().toISOString().split("T")[0];

    document.getElementById("entryDate").value =
        today;

    document.getElementById("dateReceived").value =
        today;

});


/* =====================================
   GENERATE RECORD ID
   ===================================== */

function generateRecordId() {

    const station =
        document.getElementById("station")
        .value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .substring(0,5);

    const random =
        Math.floor(1000 + Math.random() * 9000);

    return `NWSC-${station || "GEN"}-P-${random}`;

}


/* =====================================
   COLLECT FORM DATA
   ===================================== */

function collectPumpData() {

    let recordId =
        document.getElementById("recordId")
        .value
        .trim();


    if (!recordId) {

        recordId =
            generateRecordId();

        document.getElementById("recordId")
            .value = recordId;

    }


    return {

        recordId: recordId,

        entryDate:
            document.getElementById("entryDate").value,

        assetNumber:
            document.getElementById("assetNumber").value.trim(),

        serialNumber:
            document.getElementById("serialNumber").value.trim(),

        pumpManufacturer:
            document.getElementById("pumpManufacturer").value.trim(),

        pumpModel:
            document.getElementById("pumpModel").value.trim(),

        pumpType:
            document.getElementById("pumpType").value,

        pumpCapacity:
            document.getElementById("pumpCapacity").value,

        motorRating:
            document.getElementById("motorRating").value,

        motorSerialNumber:
            document.getElementById("motorSerialNumber").value.trim(),

        station:
            document.getElementById("station").value.trim(),

        location:
            document.getElementById("location").value.trim(),

        deliveredBy:
            document.getElementById("deliveredBy").value.trim(),

        dateReceived:
            document.getElementById("dateReceived").value,

        faultReported:
            document.getElementById("faultReported").value.trim(),

        condition:
            document.getElementById("condition").value

    };

}


/* =====================================
   VALIDATE FORM
   ===================================== */

function validatePump(data) {

    const required = [

        ["NWSC Asset Number", data.assetNumber],

        ["Serial Number", data.serialNumber],

        ["Pump Manufacturer", data.pumpManufacturer],

        ["Pump Model", data.pumpModel],

        ["Station", data.station]

    ];


    const missing =
        required
        .filter(item => !item[1])
        .map(item => item[0]);


    if (missing.length > 0) {

        alert(
            "Please complete:\n\n" +
            missing.join("\n")
        );

        return false;

    }


    return true;

}


/* =====================================
   GENERATE QR
   ===================================== */

function generatePump() {

    const data =
        collectPumpData();


    if (!validatePump(data)) {
        return;
    }


    const recordId =
        data.recordId;


    /*
       QR POINTS TO THIS WEBSITE
       WITH THE RECORD ID.
    */

    const qrUrl =
        WEBSITE_URL +
        "?id=" +
        encodeURIComponent(recordId);


    const qrContainer =
        document.getElementById("qr-code");


    qrContainer.innerHTML = "";


    new QRCode(qrContainer, {

        text: qrUrl,

        width: 220,

        height: 220,

        correctLevel:
            QRCode.CorrectLevel.H

    });


    document.getElementById(
        "displayRecordId"
    ).textContent = recordId;


    document.getElementById(
        "qr-section"
    ).style.display = "block";


    /*
       Save the record locally for now.
       This lets us test the complete system
       before implementing GitHub database writing.
    */

    localStorage.setItem(
        "lastPump",
        JSON.stringify(data)
    );


    console.log(
        "Pump data:",
        data
    );

    console.log(
        "QR URL:",
        qrUrl
    );

}


/* =====================================
   SHOW GENERATE TAB
   ===================================== */

function showGenerate() {

    stopScanner();


    document.getElementById(
        "generate-section"
    ).style.display = "block";


    document.getElementById(
        "scan-section"
    ).style.display = "none";


    document.getElementById(
        "generate-tab"
    ).classList.add("active");


    document.getElementById(
        "scan-tab"
    ).classList.remove("active");

}


/* =====================================
   SHOW SCANNER TAB
   ===================================== */

async function showScanner() {

    document.getElementById(
        "generate-section"
    ).style.display = "none";


    document.getElementById(
        "scan-section"
    ).style.display = "block";


    document.getElementById(
        "generate-tab"
    ).classList.remove("active");


    document.getElementById(
        "scan-tab"
    ).classList.add("active");


    await startScanner();

}


/* =====================================
   START SCANNER
   ===================================== */

async function startScanner() {

    if (scannerRunning) {
        return;
    }


    document.getElementById(
        "reader"
    ).innerHTML = "";


    scanner =
        new Html5Qrcode("reader");


    try {

        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },

            onScanSuccess,

            () => {}

        );


        scannerRunning = true;

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "reader"
        ).innerHTML =

            `<div class="error">
                Unable to start camera.
                Please allow camera access.
            </div>`;

    }

}


/* =====================================
   STOP SCANNER
   ===================================== */

async function stopScanner() {

    if (!scanner || !scannerRunning) {
        return;
    }


    try {

        await scanner.stop();

        scanner.clear();

    }

    catch(error) {

        console.log(error);

    }


    scannerRunning = false;

}


/* =====================================
   QR SCANNED
   ===================================== */

async function onScanSuccess(decodedText) {

    await stopScanner();


    let recordId =
        extractRecordId(decodedText);


    if (!recordId) {

        showError(
            "No Record ID found in QR code."
        );

        return;

    }


    document.getElementById(
        "result"
    ).style.display = "block";


    document.getElementById(
        "resultRecordId"
    ).textContent = recordId;


    document.getElementById(
        "pumpData"
    ).innerHTML =
        "<p>Loading pump information...</p>";


    await loadPump(recordId);

}


/* =====================================
   EXTRACT RECORD ID
   ===================================== */

function extractRecordId(text) {

    try {

        const url =
            new URL(text);


        const id =
            url.searchParams.get("id");


        if (id) {
            return id;
        }

    }

    catch(error) {

        // QR may contain plain text

    }


    return text.trim();

}


/* =====================================
   LOAD PUMP FROM GITHUB
   ===================================== */

async function loadPump(recordId) {

    try {

        const response =
            await fetch(
                DATABASE_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not access pumps.json"
            );

        }


        const pumps =
            await response.json();


        const pump =
            pumps.find(
                item =>
                    item.recordId === recordId
            );


        if (!pump) {

            throw new Error(
                "Pump record not found in GitHub database."
            );

        }


        displayPump(pump);

    }

    catch(error) {

        console.error(error);

        showError(
            error.message
        );

    }

}


/* =====================================
   DISPLAY PUMP
   ===================================== */

function displayPump(pump) {

    const fields = [

        ["Record ID", pump.recordId],

        ["Entry Date", pump.entryDate],

        ["NWSC Asset Number", pump.assetNumber],

        ["Serial Number", pump.serialNumber],

        ["Pump Manufacturer", pump.pumpManufacturer],

        ["Pump Model", pump.pumpModel],

        ["Pump Type", pump.pumpType],

        ["Pump Capacity (m³/h)", pump.pumpCapacity],

        ["Motor Rating (kW)", pump.motorRating],

        ["Motor Serial Number", pump.motorSerialNumber],

        ["Station", pump.station],

        ["Location / Installation Point", pump.location],

        ["Delivered By", pump.deliveredBy],

        ["Date Received", pump.dateReceived],

        ["Fault Reported", pump.faultReported],

        ["Condition", pump.condition]

    ];


    document.getElementById(
        "pumpData"
    ).innerHTML =

        fields.map(
            ([label,value]) => `

                <div class="data-row">

                    <span class="data-label">
                        ${escapeHtml(label)}
                    </span>

                    <span class="data-value">
                        ${escapeHtml(
                            value || "—"
                        )}
                    </span>

                </div>

            `
        ).join("");

}


/* =====================================
   ERROR
   ===================================== */

function showError(message) {

    document.getElementById(
        "result"
    ).style.display = "block";


    document.getElementById(
        "pumpData"
    ).innerHTML =

        `<div class="error">
            ${escapeHtml(message)}
        </div>`;

}


/* =====================================
   RESTART SCANNER
   ===================================== */

async function restartScanner() {

    document.getElementById(
        "result"
    ).style.display = "none";


    await startScanner();

}


/* =====================================
   HTML SECURITY
   ===================================== */

function escapeHtml(value) {

    return String(value)
        .replace(
            /[&<>'"]/g,
            function(char) {

                return {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    "'": "&#39;",
                    '"': "&quot;"

                }[char];

            }
        );

}

</script>

</body>
</html>
