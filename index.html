<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NWSC Pump Asset Management</title>

    <!-- QR GENERATOR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- QR SCANNER -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            padding: 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* TABS */

        .tabs {
            display: flex;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: white;
            color: #6b7280;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #1d4ed8;
            border-bottom-color: #1d4ed8;
        }

        /* FORM */

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
        }

        .btn-main {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-main:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #6b7280;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* QR */

        #qr-output {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            text-align: center;
            background: #f8fafc;
        }

        #qr-code {
            display: flex;
            justify-content: center;
            margin: 20px auto;
        }

        #qr-code img {
            width: 280px;
            height: 280px;
        }

        .record-id {
            font-size: 18px;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 10px;
        }

        .qr-info {
            background: #eff6ff;
            padding: 12px;
            border-radius: 7px;
            color: #1e40af;
            font-size: 13px;
        }

        /* SCANNER */

        #section-scan {
            display: none;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            overflow: hidden;
        }

        .scan-card {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
        }

        .scan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #bfdbfe;
        }

        .scan-title {
            color: #1e3a8a;
            font-size: 17px;
            font-weight: bold;
        }

        .badge {
            background: #1d4ed8;
            color: white;
            padding: 5px 9px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #dbeafe;
        }

        .result-label {
            font-size: 12px;
            font-weight: bold;
            color: #64748b;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 14px;
            font-weight: bold;
            color: #111827;
            text-align: right;
        }

        .status {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #b91c1c;
        }

        .warning {
            color: #b45309;
        }

        /* PRINT */

        @media print {

            body {
                background: white;
                padding: 0;
            }

            body * {
                visibility: hidden;
            }

            #qr-output,
            #qr-output * {
                visibility: visible;
            }

            #qr-output {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
            }

            .print-hide {
                display: none !important;
            }
        }

        @media(max-width:650px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

            .container {
                padding: 16px;
            }

            .result-row {
                flex-direction: column;
            }

            .result-value {
                text-align: left;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <h1>NWSC PUMP ASSET MANAGEMENT</h1>

    <div class="subtitle">
        Pump identification, QR generation and asset information retrieval
    </div>

    <!-- TABS -->

    <div class="tabs">

        <button
            id="generate-tab"
            class="tab-btn active"
            onclick="switchTab('generate')">
            LOG NEW PUMP
        </button>

        <button
            id="scan-tab"
            class="tab-btn"
            onclick="switchTab('scan')">
            SCAN PUMP QR
        </button>

    </div>


    <!-- ================================================= -->
    <!-- GENERATE SECTION -->
    <!-- ================================================= -->

    <div id="section-generate">

        <div class="grid">

            <!-- RECORD ID -->

            <div class="form-group">

                <label>Record ID</label>

                <input
                    type="text"
                    id="record-id"
                    placeholder="Automatically generated"
                    readonly>

            </div>


            <!-- ENTRY DATE -->

            <div class="form-group">

                <label>Entry Date</label>

                <input
                    type="date"
                    id="entry-date">

            </div>


            <!-- ASSET NUMBER -->

            <div class="form-group">

                <label>NWSC Asset Number</label>

                <input
                    type="text"
                    id="asset-number"
                    placeholder="e.g. 127R2">

            </div>


            <!-- SERIAL -->

            <div class="form-group">

                <label>Serial Number</label>

                <input
                    type="text"
                    id="serial-number"
                    placeholder="e.g. SN88404">

            </div>


            <!-- MANUFACTURER -->

            <div class="form-group">

                <label>Pump Manufacturer</label>

                <input
                    type="text"
                    id="pump-manufacturer"
                    placeholder="e.g. Grundfos">

            </div>


            <!-- MODEL -->

            <div class="form-group">

                <label>Pump Model</label>

                <input
                    type="text"
                    id="pump-model"
                    placeholder="e.g. 563">

            </div>


            <!-- TYPE -->

            <div class="form-group">

                <label>Pump Type</label>

                <select id="pump-type">

                    <option value="Centrifugal">
                        Centrifugal
                    </option>

                    <option value="Submersible">
                        Submersible
                    </option>

                    <option value="Booster">
                        Booster
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- CAPACITY -->

            <div class="form-group">

                <label>Pump Capacity (m³/h)</label>

                <input
                    type="number"
                    id="pump-capacity"
                    step="any"
                    placeholder="e.g. 50">

            </div>


            <!-- MOTOR RATING -->

            <div class="form-group">

                <label>Motor Rating (kW)</label>

                <input
                    type="number"
                    id="motor-rating"
                    step="any"
                    placeholder="e.g. 15">

            </div>


            <!-- MOTOR SERIAL -->

            <div class="form-group">

                <label>Motor Serial Number</label>

                <input
                    type="text"
                    id="motor-serial"
                    placeholder="e.g. 2225682">

            </div>


            <!-- STATION -->

            <div class="form-group">

                <label>Station</label>

                <input
                    type="text"
                    id="station"
                    placeholder="e.g. Lugogo">

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label>Location / Installation Point</label>

                <input
                    type="text"
                    id="location"
                    placeholder="e.g. Booster">

            </div>


            <!-- DELIVERED BY -->

            <div class="form-group">

                <label>Delivered By</label>

                <input
                    type="text"
                    id="delivered-by"
                    placeholder="e.g. Amidi">

            </div>


            <!-- DATE RECEIVED -->

            <div class="form-group">

                <label>Date Received</label>

                <input
                    type="date"
                    id="date-received">

            </div>


            <!-- FAULT -->

            <div class="form-group">

                <label>Fault Reported</label>

                <input
                    type="text"
                    id="fault-reported"
                    placeholder="e.g. Bearing">

            </div>


            <!-- CONDITION -->

            <div class="form-group">

                <label>Condition</label>

                <select id="condition">

                    <option value="Operational">
                        Operational
                    </option>

                    <option value="Under Maintenance">
                        Under Maintenance
                    </option>

                    <option value="Out of Service">
                        Out of Service
                    </option>

                    <option value="New">
                        New
                    </option>

                    <option value="Decommissioned">
                        Decommissioned
                    </option>

                </select>

            </div>

        </div>


        <!-- GENERATE -->

        <button
            class="btn-main"
            onclick="generatePumpQR()">

            GENERATE UNIQUE PUMP QR CODE

        </button>


        <!-- QR OUTPUT -->

        <div id="qr-output">

            <div class="record-id">
                RECORD ID:
                <span id="display-record-id"></span>
            </div>

            <div id="qr-code"></div>

            <div class="qr-info">

                This QR code contains the complete pump
                identification record.

                <br><br>

                Scan the QR code using the NWSC Pump Asset
                Management system to retrieve the pump details.

            </div>

            <button
                class="btn-main print-hide"
                onclick="printQR()">

                PRINT QR CODE

            </button>

            <button
                class="btn-secondary print-hide"
                onclick="clearForm()">

                CREATE ANOTHER PUMP

            </button>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- SCAN SECTION -->
    <!-- ================================================= -->

    <div id="section-scan">

        <div id="reader"></div>

        <div
            id="scan-result"
            class="scan-card">

            <div class="scan-header">

                <div class="scan-title">
                    PUMP INFORMATION
                </div>

                <div
                    id="scan-id"
                    class="badge">
                </div>

            </div>

            <div id="pump-information"></div>

            <button
                class="btn-main"
                onclick="restartScanner()">

                SCAN ANOTHER PUMP

            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const GITHUB_PAGE_URL =
    window.location.origin +
    window.location.pathname;


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let scanner = null;
let scannerRunning = false;


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener("load", function () {

    const today =
        new Date().toISOString().split("T")[0];

    document.getElementById("entry-date").value = today;

    document.getElementById("date-received").value = today;

});


/* =========================================================
   TAB SWITCH
========================================================= */

function switchTab(tab) {

    const generateSection =
        document.getElementById("section-generate");

    const scanSection =
        document.getElementById("section-scan");

    const generateTab =
        document.getElementById("generate-tab");

    const scanTab =
        document.getElementById("scan-tab");


    if (tab === "generate") {

        generateSection.style.display = "block";

        scanSection.style.display = "none";

        generateTab.classList.add("active");

        scanTab.classList.remove("active");

        stopScanner();

    }

    else {

        generateSection.style.display = "none";

        scanSection.style.display = "block";

        generateTab.classList.remove("active");

        scanTab.classList.add("active");

        startScanner();

    }

}


/* =========================================================
   UNIQUE RECORD ID
========================================================= */

function generateUniqueRecordID() {

    const station =
        document
        .getElementById("station")
        .value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .substring(0,5) || "GEN";


    const now = new Date();

    const date =
        now.getFullYear().toString() +
        String(now.getMonth()+1).padStart(2,"0") +
        String(now.getDate()).padStart(2,"0");


    const time =
        String(now.getHours()).padStart(2,"0") +
        String(now.getMinutes()).padStart(2,"0") +
        String(now.getSeconds()).padStart(2,"0");


    /*
       Random section makes accidental duplication
       practically impossible.
    */

    const random =
        Math.random()
        .toString(36)
        .substring(2,6)
        .toUpperCase();


    return `NWSC-${station}-P-${date}-${time}-${random}`;

}


/* =========================================================
   COLLECT PUMP DATA
========================================================= */

function collectPumpData() {

    const recordID =
        generateUniqueRecordID();


    return {

        id: recordID,

        entryDate:
            document.getElementById("entry-date").value,

        assetNumber:
            document.getElementById("asset-number").value.trim(),

        serialNumber:
            document.getElementById("serial-number").value.trim(),

        manufacturer:
            document.getElementById("pump-manufacturer").value.trim(),

        model:
            document.getElementById("pump-model").value.trim(),

        pumpType:
            document.getElementById("pump-type").value,

        capacity:
            document.getElementById("pump-capacity").value,

        motorRating:
            document.getElementById("motor-rating").value,

        motorSerial:
            document.getElementById("motor-serial").value.trim(),

        station:
            document.getElementById("station").value.trim(),

        location:
            document.getElementById("location").value.trim(),

        deliveredBy:
            document.getElementById("delivered-by").value.trim(),

        dateReceived:
            document.getElementById("date-received").value,

        fault:
            document.getElementById("fault-reported").value.trim(),

        condition:
            document.getElementById("condition").value

    };

}


/* =========================================================
   VALIDATE FORM
========================================================= */

function validatePump(data) {

    const required = [

        ["NWSC Asset Number", data.assetNumber],

        ["Serial Number", data.serialNumber],

        ["Pump Manufacturer", data.manufacturer],

        ["Pump Model", data.model],

        ["Station", data.station]

    ];


    const missing =
        required
        .filter(item => !item[1])
        .map(item => item[0]);


    if (missing.length > 0) {

        alert(
            "Please complete the following fields:\n\n" +
            missing.join("\n")
        );

        return false;

    }


    return true;

}


/* =========================================================
   ENCODE DATA FOR QR
========================================================= */

function encodePumpData(data) {

    /*
       Convert pump information into JSON.
    */

    const json =
        JSON.stringify(data);


    /*
       Convert JSON to Base64.
    */

    const encoded =
        btoa(
            unescape(
                encodeURIComponent(json)
            )
        );


    /*
       URL fragment is used so the QR opens
       the GitHub Pages application.
    */

    return GITHUB_PAGE_URL +
        "#pump=" +
        encoded;

}


/* =========================================================
   GENERATE QR
========================================================= */

function generatePumpQR() {

    const data =
        collectPumpData();


    if (!validatePump(data)) {

        return;

    }


    /*
       Put generated ID into form.
    */

    document.getElementById("record-id").value =
        data.id;


    /*
       Create QR payload.
    */

    const qrPayload =
        encodePumpData(data);


    /*
       Clear previous QR.
    */

    const qrContainer =
        document.getElementById("qr-code");

    qrContainer.innerHTML = "";


    /*
       Generate QR.
    */

    new QRCode(
        qrContainer,
        {

            text: qrPayload,

            width: 280,

            height: 280,

            correctLevel:
                QRCode.CorrectLevel.M

        }
    );


    /*
       Display ID.
    */

    document.getElementById("display-record-id")
        .textContent = data.id;


    /*
       Show QR section.
    */

    document.getElementById("qr-output")
        .style.display = "block";


    /*
       Save locally as a backup.
    */

    savePumpLocally(data);

}


/* =========================================================
   SAVE LOCAL BACKUP
========================================================= */

function savePumpLocally(data) {

    let pumps =
        JSON.parse(
            localStorage.getItem("nwscPumps") || "[]"
        );


    pumps.push(data);


    localStorage.setItem(
        "nwscPumps",
        JSON.stringify(pumps)
    );

}


/* =========================================================
   SCANNER
========================================================= */

async function startScanner() {

    if (scannerRunning) {

        return;

    }


    if (!window.Html5Qrcode) {

        alert(
            "QR scanner library could not load."
        );

        return;

    }


    document.getElementById("reader")
        .innerHTML = "";


    scanner =
        new Html5Qrcode("reader");


    try {

        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }

            },

            onQRScan,

            function() {}

        );


        scannerRunning = true;

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to start camera.\n\n" +
            "Please allow camera access."
        );

    }

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

    if (!scanner || !scannerRunning) {

        return;

    }


    try {

        await scanner.stop();

        scanner.clear();

    }

    catch(error) {

        console.log(error);

    }


    scannerRunning = false;

}


/* =========================================================
   QR SCANNED
========================================================= */

async function onQRScan(decodedText) {

    await stopScanner();


    /*
       Extract pump data.
    */

    const pump =
        decodePumpData(decodedText);


    if (!pump) {

        showScanError(
            "This QR code does not contain a valid NWSC pump record."
        );

        return;

    }


    displayPumpInformation(pump);

}


/* =========================================================
   DECODE QR
========================================================= */

function decodePumpData(text) {

    try {

        /*
           Check whether QR contains
           our pump fragment.
        */

        const hashIndex =
            text.indexOf("#pump=");


        if (hashIndex === -1) {

            return null;

        }


        const encoded =
            text.substring(
                hashIndex + 6
            );


        /*
           Decode Base64.
        */

        const json =
            decodeURIComponent(
                escape(
                    atob(encoded)
                )
            );


        return JSON.parse(json);

    }

    catch(error) {

        console.error(
            "QR decoding error:",
            error
        );

        return null;

    }

}


/* =========================================================
   DISPLAY PUMP
========================================================= */

function displayPumpInformation(pump) {

    document.getElementById(
        "scan-result"
    ).style.display = "block";


    document.getElementById(
        "scan-id"
    ).textContent = pump.id;


    const fields = [

        ["Record ID", pump.id],

        ["Entry Date", pump.entryDate],

        ["NWSC Asset Number", pump.assetNumber],

        ["Serial Number", pump.serialNumber],

        ["Pump Manufacturer", pump.manufacturer],

        ["Pump Model", pump.model],

        ["Pump Type", pump.pumpType],

        ["Pump Capacity (m³/h)", pump.capacity],

        ["Motor Rating (kW)", pump.motorRating],

        ["Motor Serial Number", pump.motorSerial],

        ["Station", pump.station],

        ["Location / Installation Point", pump.location],

        ["Delivered By", pump.deliveredBy],

        ["Date Received", pump.dateReceived],

        ["Fault Reported", pump.fault],

        ["Condition", pump.condition]

    ];


    const html =
        fields.map(function(field) {

            return `

                <div class="result-row">

                    <span class="result-label">
                        ${escapeHTML(field[0])}
                    </span>

                    <span class="result-value">
                        ${escapeHTML(field[1] || "—")}
                    </span>

                </div>

            `;

        }).join("");


    document.getElementById(
        "pump-information"
    ).innerHTML = html;

}


/* =========================================================
   SCAN ERROR
========================================================= */

function showScanError(message) {

    document.getElementById(
        "scan-result"
    ).style.display = "block";


    document.getElementById(
        "pump-information"
    ).innerHTML = `

        <div class="status error">

            ${escapeHTML(message)}

        </div>

    `;

}


/* =========================================================
   RESTART SCANNER
========================================================= */

async function restartScanner() {

    document.getElementById(
        "scan-result"
    ).style.display = "none";


    await startScanner();

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm() {

    const fields = [

        "record-id",

        "asset-number",

        "serial-number",

        "pump-manufacturer",

        "pump-model",

        "pump-capacity",

        "motor-rating",

        "motor-serial",

        "station",

        "location",

        "delivered-by",

        "fault-reported"

    ];


    fields.forEach(function(id) {

        document.getElementById(id).value = "";

    });


    document.getElementById(
        "pump-type"
    ).value = "Centrifugal";


    document.getElementById(
        "condition"
    ).value = "Operational";


    const today =
        new Date()
        .toISOString()
        .split("T")[0];


    document.getElementById(
        "entry-date"
    ).value = today;


    document.getElementById(
        "date-received"
    ).value = today;


    document.getElementById(
        "qr-code"
    ).innerHTML = "";


    document.getElementById(
        "qr-output"
    ).style.display = "none";

}


/* =========================================================
   PRINT QR
========================================================= */

function printQR() {

    window.print();

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/[&<>'"]/g, function(character) {

            return {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                "'": "&#39;",

                '"': "&quot;"

            }[character];

        });

}


/* =========================================================
   AUTOMATIC QR LINK OPENING
========================================================= */

window.addEventListener(
    "load",
    function() {

        const hash =
            window.location.hash;


        if (hash.startsWith("#pump=")) {

            /*
               Someone opened a pump QR directly.
               Automatically decode and display it.
            */

            const pump =
                decodePumpData(
                    window.location.href
                );


            if (pump) {

                switchTab("scan");

                displayPumpInformation(pump);

            }

        }

    }
);

</script>
